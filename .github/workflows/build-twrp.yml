name: Build TWRP - Vsmart Joy 4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip fontconfig python3 python-is-python3 rsync \
            ccache lz4 liblz4-tool

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Extract Joy 4 device tree
        run: |
          test -f juniper-source.zip
          rm -rf juniper
          mkdir -p juniper
          unzip -q juniper-source.zip -d juniper
          test -f juniper/device/vsmart/juniper/BoardConfig.mk
          test -f juniper/device/vsmart/juniper/AndroidProducts.mk
          test -f juniper/device/vsmart/juniper/twrp_juniper.mk
          echo "Joy 4 device tree extracted successfully"

      - name: Initialize TWRP
        run: |
          mkdir -p twrp
          cd twrp
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1

      - name: Sync TWRP source
        working-directory: twrp
        run: |
          repo sync -c --force-sync --no-clone-bundle --no-tags -j2

      - name: Install Joy 4 device tree
        run: |
          mkdir -p twrp/device/vsmart
          rm -rf twrp/device/vsmart/juniper
          cp -a juniper/device/vsmart/juniper twrp/device/vsmart/

      - name: Check device tree
        run: |
          test -f twrp/device/vsmart/juniper/BoardConfig.mk
          test -f twrp/device/vsmart/juniper/AndroidProducts.mk
          test -f twrp/device/vsmart/juniper/twrp_juniper.mk
          echo "Joy 4 juniper device tree OK"

      - name: Build recovery
        working-directory: twrp
        run: |
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_juniper-eng
          mka recoveryimage -j2

      - name: Prepare artifact
        run: |
          set -e
          mkdir -p output

          echo "Searching for recovery image..."
          find twrp/out -type f \( -name "recovery.img" -o -name "recovery-*.img" \) -print

          IMG="$(find twrp/out -type f -name "recovery.img" | head -n 1)"

          if [ -z "$IMG" ]; then
            echo "::error::recovery.img was not found after a successful recoveryimage build."
            echo "Available image files:"
            find twrp/out -type f -name "*.img" -print | sort || true
            echo "Relevant recovery build files:"
            find twrp/out/target/product/juniper -maxdepth 5 -type f \
              \( -iname "*recovery*" -o -iname "*ramdisk*" \) -print 2>/dev/null | sort || true
            exit 1
          fi

          echo "Found recovery image: $IMG"
          cp "$IMG" output/twrp-juniper-B3.img
          test -s output/twrp-juniper-B3.img

          sha256sum output/twrp-juniper-B3.img > output/SHA256SUMS.txt
          ls -lh output/

      - name: Upload TWRP
        uses: actions/upload-artifact@v4
        with:
          name: twrp-juniper-B3
          path: output/
